server {
    server_name vikasst.shop www.vikasst.shop;

    root /var/www/bloodbank/src;
    index index.php index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny access to local config file
    location ~* /config\.local\.php$ {
        deny all;
        return 404;
    }

    # Deny hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }

    # Static assets
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vikasst.shop/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vikasst.shop/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.vikasst.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = vikasst.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name vikasst.shop www.vikasst.shop;
    return 404; # managed by Certbot
}
