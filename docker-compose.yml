services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: bloodbank
      DB_PASS: bloodbank
      DB_NAME: bloodbank
    depends_on:
      - db

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: bloodbank
      MYSQL_USER: bloodbank
      MYSQL_PASSWORD: bloodbank
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
